<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background circle dark -->
  <circle cx="50" cy="50" r="48" fill="#0A0A0A" stroke="#D4AF37" stroke-width="2.5" />
  <circle cx="50" cy="50" r="44" fill="none" stroke="#D4AF37" stroke-width="0.75" opacity="0.6" />
  
  <!-- Hour tick marks (12, 3, 6, 9) -->
  <line x1="50" y1="12" x2="50" y2="21" stroke="#D4AF37" stroke-width="1.75" stroke-linecap="round" />
  <line x1="88" y1="50" x2="79" y2="50" stroke="#D4AF37" stroke-width="1.75" stroke-linecap="round" />
  <line x1="50" y1="88" x2="50" y2="79" stroke="#D4AF37" stroke-width="1.75" stroke-linecap="round" />
  <line x1="12" y1="50" x2="21" y2="50" stroke="#D4AF37" stroke-width="1.75" stroke-linecap="round" />

  <!-- Hour hand (~10h10) -->
  <line x1="50" y1="50" x2="34" y2="30" stroke="#F5F5F0" stroke-width="2" stroke-linecap="round" />
  
  <!-- Minute hand (~10h10) -->
  <line x1="50" y1="50" x2="72" y2="40" stroke="#F5F5F0" stroke-width="1.75" stroke-linecap="round" />

  <!-- Center pentagon pinion -->
  <polygon points="50,46.5 53.5,49 52,53.5 48,53.5 46.5,49" fill="#D4AF37" stroke="#0A0A0A" stroke-width="0.75" />
  <!-- Center pivot dot -->
  <circle cx="50" cy="50" r="1" fill="#0A0A0A" />
</svg>
