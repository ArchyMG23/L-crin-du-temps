<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Standalone Luxury Clock Dial Emblem -->
  <g transform="translate(10, 10)">
    <!-- Outer gold bezel ring -->
    <circle cx="50" cy="50" r="48" fill="none" stroke="#D4AF37" stroke-width="2.5" />
    <circle cx="50" cy="50" r="45" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.6" />
    
    <!-- Hour marks at 12, 3, 6, 9 -->
    <line x1="50" y1="10" x2="50" y2="20" stroke="#D4AF37" stroke-width="1.8" stroke-linecap="round" />
    <line x1="90" y1="50" x2="80" y2="50" stroke="#D4AF37" stroke-width="1.8" stroke-linecap="round" />
    <line x1="50" y1="90" x2="50" y2="80" stroke="#D4AF37" stroke-width="1.8" stroke-linecap="round" />
    <line x1="10" y1="50" x2="20" y2="50" stroke="#D4AF37" stroke-width="1.8" stroke-linecap="round" />

    <!-- Hands at 10:10 -->
    <line x1="50" y1="50" x2="33" y2="29" stroke="#D4AF37" stroke-width="2.2" stroke-linecap="round" />
    <line x1="50" y1="50" x2="74" y2="40" stroke="#D4AF37" stroke-width="1.8" stroke-linecap="round" />

    <!-- Center pentagonal hub -->
    <polygon points="50,46 54,49 52.5,54 47.5,54 46,49" fill="#D4AF37" stroke="#111111" stroke-width="0.75" />
    <circle cx="50" cy="50" r="1.2" fill="#111111" />
  </g>
</svg>
